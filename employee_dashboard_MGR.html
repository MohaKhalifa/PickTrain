<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="styles/dash_styles.css" />
  </head>
  <body>
    <div class="nav">
      <span>
        <h2 style="margin-left: 10px">
          <i style="font-size: larger; padding-right: 10px">Manage Trains </i
          ><b
            style="
              border: solid 0.5px lightblue;
              border-radius: 8px;
              padding: 7px;
              font-size: medium;
            "
            >User: <b id="empUser"></b
          ></b>
        </h2>
      </span>
      <span>
        <a href="employee_dashboard_MGT.html">Tickets</a>
        <a href="employee_dashboard_MGR.html">Trains</a>
        <button onclick="logout()" class="btn-red">Log Out</button>
      </span>
    </div>

    <div class="box">
      <h3>Create New Train Route</h3>
      <form id="addRouteForm" class="form">
        <input type="hidden" name="action" value="add_train" />
        <input type="text" name="t_num" required placeholder="Train Name" />
        <select name="src" required>
          <option value="Port Sudan">Port Sudan</option>
          <option value="Khartoum">Khartoum</option>
          <option value="Atbara">Atbara</option>
          <option value="Abu Hamed">Abu Hamed</option>
          <option value="Wadi Halfa">Wadi Halfa</option>
          <option value="El-Obeid">El-Obeid</option>
        </select>

        <select name="dst" required>
          <option value="Khartoum">Khartoum</option>
          <option value="Port Sudan">Port Sudan</option>
          <option value="Atbara">Atbara</option>
          <option value="Abu Hamed">Abu Hamed</option>
          <option value="Wadi Halfa">Wadi Halfa</option>
          <option value="El-Obeid">El-Obeid</option>
        </select>

        <input type="datetime-local" name="dep" required />
        <input type="number" name="seats" required placeholder="Seats" />
        <input
          type="number"
          name="prc"
          step="0.01"
          required
          placeholder="Price"
        />
        <button type="submit" class="btn-blue">Add Route</button>
      </form>
    </div>

    <div class="box">
      <h3>Available Train Routes</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Train Name</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Departure</th>
            <th>Seats</th>
            <th>Price</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody id="trainsTbody"></tbody>
      </table>
    </div>
    <script src="javascript/employee_dashboard_MGR.js"></script>
  </body>
</html>
