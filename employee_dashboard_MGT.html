<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="styles/dash_styles.css" />
  </head>
  <body>
    <div class="nav">
      <span>
        <h2 style="margin-left: 10px">
          <i style="font-size: larger; padding-right: 10px">Manage Tickets </i
          ><b
            style="
              border: solid 0.5px lightblue;
              border-radius: 8px;
              padding: 7px;
              font-size: medium;
            "
            >User: <b id="empUser"></b
          ></b>
        </h2>
      </span>
      <span>
        <a href="employee_dashboard_MGT.html">Tickets</a>
        <a href="employee_dashboard_MGR.html">Trains</a>
        <button onclick="logout()" class="btn-red">Log Out</button>
      </span>
    </div>
    <div class="box">
      <h3>
        Manage Ticket Requests
        <button onclick="loadt()" class="btn-green">Refresh</button>
      </h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Passenger</th>
            <th>Train Name</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Departure</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Approval</th>
          </tr>
        </thead>
        <tbody id="bookingsTbody"></tbody>
      </table>
    </div>
    <script src="javascript/employee_dashboard_MGT.js"></script>
  </body>
</html>
